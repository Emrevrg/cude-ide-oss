<!doctype html>
<html lang="{{LANG}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root{color-scheme:light dark}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;height:100vh;overflow:hidden;background:var(--vscode-editor-background);color:var(--vscode-foreground);font:13px/1.5 var(--vscode-font-family,system-ui,sans-serif)}button,input,select,textarea{font:inherit;color:inherit}button{border:1px solid var(--vscode-panel-border);background:transparent;padding:6px 10px;border-radius:5px;cursor:pointer}button:hover{background:var(--vscode-list-hoverBackground)}button.primary{background:var(--cude-accent,#d69b70);color:#1a120c;border-color:transparent}button:disabled{opacity:.5;cursor:default}input,select,textarea{width:100%;background:var(--vscode-input-background);border:1px solid var(--vscode-input-border,var(--vscode-panel-border));border-radius:5px;padding:8px}textarea{min-height:76px;resize:vertical}header{height:48px;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--vscode-panel-border)}.brand{font-weight:600}.layout{display:flex;border:1px solid var(--vscode-panel-border);border-radius:6px;overflow:hidden}.layout button{border:0;border-radius:0;padding:5px 10px}.layout [aria-pressed=true]{background:color-mix(in srgb,var(--cude-accent,#d69b70) 18%,transparent);color:var(--vscode-foreground)}.head-spacer{flex:1}.workspace{height:calc(100vh - 48px);display:grid;grid-template-columns:minmax(200px,23%) minmax(260px,1fr) minmax(260px,30%)}.pane{min-width:0;overflow:auto}.pane+.pane{border-left:1px solid var(--vscode-panel-border)}.pane-head{height:44px;position:sticky;top:0;display:flex;align-items:center;gap:8px;padding:0 14px;background:var(--vscode-editor-background);border-bottom:1px solid var(--vscode-panel-border);z-index:1;font-weight:600}.pane-head button{margin-left:auto}.agent-list{padding:8px}.agent{width:100%;text-align:left;display:block;border:0;border-radius:5px;padding:9px 10px;margin:2px 0}.agent[aria-current=true]{background:color-mix(in srgb,var(--cude-accent,#d69b70) 18%,transparent);color:var(--vscode-foreground)}.agent-title{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta{display:flex;align-items:center;gap:7px;color:var(--vscode-descriptionForeground);font-size:11px;margin-top:3px}.dot{width:7px;height:7px;border-radius:50%;background:var(--vscode-descriptionForeground)}.dot.running{background:var(--vscode-testing-iconPassed)}.dot.failed{background:var(--vscode-errorForeground)}.dot.queued{background:var(--vscode-editorWarning-foreground)}.empty{margin:24px 16px;color:var(--vscode-descriptionForeground)}.center{padding-bottom:16px}.conversation{padding:18px 20px;white-space:pre-wrap}.activity{padding:8px 20px;border-top:1px solid var(--vscode-panel-border);color:var(--vscode-descriptionForeground)}.step{padding:8px 20px;border-top:1px solid var(--vscode-panel-border)}.step-title{font-weight:500}.step-detail{color:var(--vscode-descriptionForeground);margin-top:3px}.files{padding:8px}.file{border:1px solid var(--vscode-panel-border);border-radius:6px;padding:10px;margin:6px 0}.file-top{display:flex;align-items:center;gap:7px;min-width:0}.file-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--vscode-editor-font-family,monospace)}.counts{white-space:nowrap;font-size:11px;color:var(--vscode-descriptionForeground)}.file-actions{display:flex;gap:6px;margin-top:9px}.file-actions button{padding:4px 8px;font-size:12px}.create{padding:12px;border-top:1px solid var(--vscode-panel-border);display:grid;gap:8px}.create label{display:grid;gap:4px;color:var(--vscode-descriptionForeground);font-size:11px}.file-body{margin-top:8px;max-height:220px;overflow:auto}.file-body pre{margin:0;padding:9px;background:var(--vscode-textCodeBlock-background);white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.5 var(--vscode-editor-font-family,monospace)}.small{font-size:11px;color:var(--vscode-descriptionForeground)}#status{padding:0 10px;color:var(--vscode-descriptionForeground)}
  :root{--cude-accent:#d69b70}body.vscode-light,body.vscode-high-contrast-light{--cude-accent:#b8713f}
:focus-visible{outline:1px solid var(--cude-accent);outline-offset:1px}
</style>
<style>{{WEBVIEW_SELECT}}</style></head>
<body>
  <header><span class="brand" data-i18n="agent.title">Cude · Agents</span><nav class="layout" aria-label="Layout"><button data-layout="editor" aria-pressed="false" data-i18n="agent.editor">Editor</button><button data-layout="agents" aria-pressed="true" data-i18n="agent.agents">Agents</button></nav><span class="head-spacer"></span><span id="status" role="status"></span><button data-action="worktree" data-i18n="agent.worktree">New worktree</button><button class="primary" data-action="new" data-i18n="agent.new">New agent</button></header>
  <main class="workspace">
    <section class="pane"><div class="pane-head"><span data-i18n="agent.list">Agents</span> <span class="head-spacer"></span><button data-action="refresh" aria-label="Refresh" data-i18n-aria="agent.refresh">↻</button></div><div class="agent-list" id="agents"></div><div class="create" id="create" hidden><label><span data-i18n="agent.task">Task</span><textarea id="task" placeholder="Describe the agent task clearly" data-i18n-placeholder="agent.taskHint"></textarea></label><label><span data-i18n="agent.model">Model</span><select id="model"><option value="" data-i18n="agent.activeModel">Active model</option></select></label><label><span data-i18n="agent.permission">Permission</span><select id="permission"><option value="ask" data-i18n="permission.ask">Ask before edits</option><option value="auto" data-i18n="permission.auto">Auto edit</option><option value="plan" data-i18n="permission.plan">Plan only</option><option value="readonly" data-i18n="agent.readOnly">Read only</option><option value="full" data-i18n="permission.full">Full access</option></select></label><label><span data-i18n="agent.location">Working location</span><select id="location"><option value="workspace" data-i18n="agent.workspace">This workspace</option><option value="worktree" data-i18n="agent.newWorktree">New Git worktree</option></select></label><button class="primary" data-action="start" data-i18n="agent.start">Start agent</button></div></section>
    <section class="pane center"><div class="pane-head" id="conversation-title" data-i18n="agent.conversation">Conversation</div><div id="conversation" class="conversation" data-i18n="agent.select">Select an agent or start a task.</div><div id="steps"></div><div id="activity"></div></section>
    <section class="pane"><div class="pane-head"><span data-i18n="agent.changes">Changes</span> <span class="head-spacer"></span><button data-action="accept-all" data-i18n="agent.acceptAll">Accept all</button></div><div class="files" id="files"></div></section>
  </main>
  <script nonce="__NONCE__">
    const api=acquireVsCodeApi(),byId=id=>document.getElementById(id);let agents=[],selected='',expandedFile='',language='{{LANG}}',dictionary={{I18N}};const t=key=>dictionary[language]?.[key]||dictionary.en[key]||key;function applyI18n(){document.documentElement.lang=language;document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));document.querySelectorAll('[data-i18n-aria]').forEach(el=>el.setAttribute('aria-label',t(el.dataset.i18nAria)));document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>el.placeholder=t(el.dataset.i18nPlaceholder));}applyI18n();
    const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function render(){const current=agents.find(a=>a.id===selected)||agents[0];if(current)selected=current.id;byId('agents').replaceChildren(...agents.map(a=>{const b=document.createElement('button');b.className='agent';b.setAttribute('aria-current',String(a.id===selected));b.dataset.agent=a.id;const state=t('status.'+a.status)||a.status;b.innerHTML=`<span class="agent-title">${esc(a.title)}</span><span class="meta"><i class="dot ${esc(a.status)}"></i>${esc(a.activity||state)} · ${Math.max(0,Math.round(((a.finishedAt||Date.now())-(a.startedAt||Date.now()))/1000))} s · ${a.steps?.filter(s=>s.kind==='file').length||0} ${t('agent.files')}</span>`;return b;}));
      byId('conversation-title').textContent=current?.title||t('agent.conversation');byId('conversation').textContent=current?.output||t('agent.select');byId('steps').replaceChildren(...(current?.steps||[]).map(s=>{const row=document.createElement('div');row.className='step';row.innerHTML=`<div class="step-title">${esc(s.title)}</div>${s.path?`<div class="step-detail">${esc(s.path)}</div>`:''}${s.kind==='command'?`<div class="step-detail">${esc(s.command)}</div>`:''}`;return row;}));byId('activity').replaceChildren(...(current?.subagents||[]).map(s=>{const row=document.createElement('div');row.className='activity';row.textContent=`${t('agent.subagent')} · ${s.title} · ${s.status}`;return row;}));
      const fileSteps=(current?.steps||[]).filter(s=>s.kind==='file'&&s.path&&typeof s.content==='string');byId('files').replaceChildren(...fileSteps.map(s=>{const card=document.createElement('article');card.className='file';const counts=(current?.acceptedFiles||[]).includes(s.path)?t('agent.accepted'):(current?.rejectedFiles||[]).includes(s.path)?t('agent.rejected'):t('agent.pending');card.innerHTML=`<div class="file-top"><span class="file-name">${esc(s.path)}</span><span class="counts">${esc(counts)}</span></div><div class="file-actions"><button data-preview="${esc(s.path)}">${t('chat.preview')}</button><button data-accept="${esc(s.path)}">${t('chat.accept')}</button><button data-reject="${esc(s.path)}">${t('chat.reject')}</button></div>${expandedFile===s.path?`<div class="file-body"><pre>${esc(s.content)}</pre></div>`:''}`;return card;}));if(current?.worktreePath){const merge=document.createElement('button');merge.className='primary';merge.textContent=t('agent.merge');merge.dataset.action='merge';byId('files').appendChild(merge);}
    }
    function post(message){api.postMessage(message)}
    document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.agent){selected=t.dataset.agent;expandedFile='';render();return;}if(t.dataset.layout){post({type:'layout',value:t.dataset.layout});return;}if(t.dataset.preview){expandedFile=expandedFile===t.dataset.preview?'':t.dataset.preview;render();post({type:'previewFile',agentId:selected,path:t.dataset.preview});return;}if(t.dataset.accept){post({type:'reviewFile',agentId:selected,path:t.dataset.accept,accept:true});return;}if(t.dataset.reject){post({type:'reviewFile',agentId:selected,path:t.dataset.reject,accept:false});return;}if(t.dataset.action==='new'){byId('create').hidden=!byId('create').hidden;return;}if(t.dataset.action==='start'){const task=byId('task').value.trim();if(!task){byId('task').focus();return;}const choice=byId('model').value?JSON.parse(decodeURIComponent(byId('model').value)):{};post({type:'startAgent',task,permission:byId('permission').value,location:byId('location').value,...choice});byId('task').value='';byId('create').hidden=true;return;}if(t.dataset.action==='accept-all'){post({type:'reviewFile',agentId:selected,accept:true});return;}if(t.dataset.action==='worktree'){post({type:'worktree'});return;}if(t.dataset.action==='merge'){post({type:'mergeWorktree',agentId:selected});return;}if(t.dataset.action==='refresh'){post({type:'refresh'});}});
    window.addEventListener('message',e=>{const d=e.data;if(d.type==='language'){language=d.language==='tr'?'tr':'en';dictionary=d.dictionary||dictionary;applyI18n();render();}if(d.type==='agents'){agents=d.agents||[];render();}if(d.type==='models'){const sel=byId('model');sel.replaceChildren(new Option(t('agent.activeModel'),''));for(const profile of d.providers||[])for(const model of profile.models||[]){const value=encodeURIComponent(JSON.stringify({providerId:profile.id,model}));sel.add(new Option(`${profile.name} · ${model}`,value));}}if(d.type==='status')byId('status').textContent=d.message||'';});post({type:'ready'});
  </script>
</body>
</html>
