<!doctype html>
<html lang="{{LANG}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; form-action 'none'; img-src {{CSP}} data:; style-src {{CSP}} 'unsafe-inline'; script-src 'nonce-{{NONCE}}';">
  <style>
    :root {
      color-scheme: light dark;
      --bg: var(--vscode-sideBar-background, #141513);
      --surface: var(--vscode-input-background, #191a18);
      --raised: var(--vscode-editorWidget-background, #20211e);
      --line: var(--vscode-input-border, #393a35);
      --text: var(--vscode-sideBar-foreground, #e9e9e4);
      --muted: var(--vscode-descriptionForeground, #aaa99f);
      --quiet: var(--vscode-disabledForeground, #88877f);
      --accent: #d69b70;
      --positive: var(--vscode-gitDecoration-addedResourceForeground, #83b48b);
      --negative: var(--vscode-gitDecoration-deletedResourceForeground, #d48a83);
      --shadow: 0 8px 24px #0002;
      --syntax-keyword: var(--vscode-symbolIcon-keywordForeground, #d7a681);
      --syntax-string: var(--vscode-symbolIcon-stringForeground, #b6c69d);
      --syntax-comment: var(--vscode-editorCodeLens-foreground, #88877e);
      --syntax-number: var(--vscode-symbolIcon-numberForeground, #d69b70);
      --syntax-type: var(--vscode-symbolIcon-classForeground, #a9b99f);
      --syntax-added: var(--vscode-gitDecoration-addedResourceForeground, #83b48b);
      --syntax-removed: var(--vscode-gitDecoration-deletedResourceForeground, #d48a83);
      font: 13px/1.5 var(--vscode-font-family, "Segoe UI", system-ui, sans-serif);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--vscode-font-family, "Segoe UI", system-ui, sans-serif); font-size: 13px; }
    button, textarea, select { font: inherit; }
    button { color: inherit; }
    .shell { height: 100vh; min-height: 360px; display: flex; flex-direction: column; padding: 0 18px; }
    .top { height: 50px; min-height: 50px; display: flex; align-items: center; gap: 4px; }
    .thread { flex: 1 1 auto; min-width: 0; max-width: 260px; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: transparent; border: 0; border-radius: 5px; padding: 7px 8px; font-weight: 550; cursor: pointer; }
    .thread:hover, .icon:hover, .mode:hover, .tool:hover, .quiet-button:hover { background: var(--raised); color: var(--text); }
    .modes { display: flex; align-items: center; gap: 1px; margin: 0 4px; padding: 3px; background: var(--raised); border-radius: 6px; }
    .mode { border: 0; background: transparent; color: var(--muted); padding: 5px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; white-space: nowrap; }
    .mode.active { color: var(--text); background: var(--bg); box-shadow: 0 1px 2px #0002; }
    .grow { flex: 1 1 6px; min-width: 4px; }
    .icon { flex: 0 0 30px; width: 30px; height: 30px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 5px; background: transparent; color: var(--muted); cursor: pointer; }
    .icon svg { width: 16px; height: 16px; }
    .project { flex: 0 1 24%; min-width: 0; max-width: 24%; margin-left: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 11px; }
    .history { flex: 1 1 auto; min-height: 0; overflow: auto; scrollbar-color: var(--line) transparent; padding: 22px 0 16px; }
    .column { width: 100%; max-width: 760px; margin: 0 auto; }
    .empty { min-height: min(48vh, 380px); display: flex; flex-direction: column; justify-content: center; align-items: flex-start; padding: 22px clamp(10px, 4vw, 36px); }
    .brand { width: 44px; height: 44px; object-fit: contain; margin-bottom: 20px; }
    .empty h1 { margin: 0 0 6px; font-size: 18px; line-height: 1.3; letter-spacing: -.2px; font-weight: 560; }
    .empty p { margin: 0; max-width: 420px; color: var(--muted); font-size: 12px; }
    .shortcuts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; width: min(100%, 410px); margin-top: 24px; }
    .shortcut { min-height: 40px; display: flex; align-items: center; gap: 9px; padding: 8px 10px; text-align: left; color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
    .shortcut:hover { color: var(--text); border-color: var(--accent); background: var(--raised); }
    .shortcut kbd { margin-left: auto; color: var(--quiet); font: 10px var(--vscode-editor-font-family, Consolas, monospace); }
    .message { margin: 0 4px 22px; overflow-wrap: anywhere; animation: appear 120ms ease-out both; }
    .message.user { width: fit-content; max-width: min(86%, 680px); margin-left: auto; padding: 9px 13px; background: var(--raised); border: 1px solid var(--line); border-radius: 12px 12px 3px 12px; white-space: pre-wrap; }
    .message.assistant { padding: 0 8px; line-height: 1.68; }
    .message.assistant p { margin: 0 0 12px; }
    .message.assistant h1, .message.assistant h2, .message.assistant h3 { margin: 18px 0 7px; font-size: 14px; line-height: 1.4; font-weight: 600; }
    .message.assistant ul, .message.assistant ol { margin: 5px 0 13px; padding-left: 22px; }
    .message.assistant li { margin: 3px 0; }
    .message.assistant code.inline { padding: 2px 5px; color: var(--text); background: var(--raised); border: 1px solid var(--line); border-radius: 4px; font: 11px var(--vscode-editor-font-family, Consolas, monospace); }
    .code { margin: 12px 0; overflow: hidden; background: var(--vscode-editor-background, var(--surface)); border: 1px solid var(--line); border-radius: 7px; }
    .code-head { min-height: 33px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 6px 0 10px; color: var(--muted); border-bottom: 1px solid var(--line); font-size: 11px; }
    .code-label { display: flex; align-items: center; gap: 6px; min-width: 0; overflow: hidden; } .code-path { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--vscode-editor-font-family, Consolas, monospace); } .code-lang { flex: 0 0 auto; padding: 1px 5px; border: 1px solid var(--line); border-radius: 4px; font-size: 10px; }
    .code-actions { display: flex; flex: 0 0 auto; gap: 2px; } .code-actions button { white-space: nowrap; }
    .copy { padding: 4px 7px; border: 0; border-radius: 4px; background: transparent; color: var(--muted); cursor: pointer; font-size: 10px; }
    .copy:hover { background: var(--raised); color: var(--text); }
    .code-actions { display:flex;align-items:center;gap:2px; }
    .code pre { margin: 0; padding: 12px; overflow: auto; color: var(--text); font: 11px/1.6 var(--vscode-editor-font-family, Consolas, monospace); tab-size: 2; }
    .tok-keyword { color: var(--syntax-keyword); }.tok-string { color: var(--syntax-string); }.tok-comment { color: var(--syntax-comment); font-style: italic; }.tok-number { color: var(--syntax-number); }.tok-type { color: var(--syntax-type); }.tok-property { color: var(--syntax-type); }.tok-added { color: var(--syntax-added); }.tok-removed { color: var(--syntax-removed); }
    .file-link { padding: 0; border: 0; border-bottom: 1px dotted var(--muted); background: transparent; color: var(--accent, var(--accent)); cursor: pointer; font: inherit; }
    .activity { margin: 0 8px 12px; color: var(--muted); font-size: 11px; }
    .activity summary { display: flex; align-items: center; gap: 7px; list-style: none; cursor: pointer; }
    .activity summary::-webkit-details-marker { display: none; }
    .activity summary::before { content: '›'; color: var(--quiet); transition: transform 120ms ease; }
    .activity[open] summary::before { transform: rotate(90deg); }
    .activity-icon { width: 13px; height: 13px; flex: 0 0 13px; color: var(--quiet); }
    .activity.running summary > .activity-label { background: linear-gradient(100deg, var(--muted) 38%, var(--text) 50%, var(--muted) 62%); background-size: 220% 100%; color: transparent; background-clip: text; -webkit-background-clip: text; animation: sheen 1.8s linear infinite; }
    .activity.done { color: var(--quiet); }
    .activity .duration { margin-left: auto; color: var(--quiet); font-size: 10px; }
    .activity-content { margin: 6px 0 2px 13px; padding-left: 10px; color: var(--muted); border-left: 1px solid var(--line); white-space: pre-wrap; overflow-wrap: anywhere; }
    .status { display: flex; align-items: center; gap: 8px; margin: 0 8px 14px; color: var(--muted); font-size: 11px; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
    .status span:last-child { background: linear-gradient(100deg, var(--muted) 38%, var(--text) 50%, var(--muted) 62%); background-size: 220% 100%; color: transparent; background-clip: text; -webkit-background-clip: text; animation: sheen 1.8s linear infinite; }
    .plan, .changes { margin: 12px 4px 22px; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 7px; }
    .card-head { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 560; }
    .card-head .count { flex: 0 0 auto; white-space: nowrap; padding: 2px 7px; color: var(--muted); background: var(--raised); border: 1px solid var(--line); border-radius: 999px; font-size: 10px; font-weight: 400; line-height: 1.35; }
    .plan-summary { margin: 7px 0 10px; color: var(--muted); font-size: 11px; }
    .plan-step { display: flex; align-items: center; gap: 9px; min-height: 36px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 11px; }
    .plan-step .step-type { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 5px; min-width: 66px; color: var(--muted); font: 10px var(--vscode-font-family, "Segoe UI", system-ui, sans-serif); }
    .step-type svg { width: 13px; height: 13px; color: var(--quiet); }
    .plan-step .step-title { flex: 1; min-width: 0; }
    .plan-step button, .secondary { padding: 5px 8px; color: var(--text); background: transparent; border: 1px solid var(--line); border-radius: 4px; cursor: pointer; font-size: 10px; }
    .plan-step button:hover, .secondary:hover { border-color: var(--accent); }
    .artifact { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); color: var(--muted); font-size: 10px; }
    .change-actions { display: flex; gap: 6px; margin-left: auto; }
    .file-list { display: grid; gap: 5px; margin-top: 9px; padding-top: 8px; border-top: 1px solid var(--line); }
    .file-row { display: flex; align-items: center; gap: 8px; min-width: 0; color: var(--muted); font-size: 10px; }
    .file-name { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .plus { color: var(--positive); }.minus { color: var(--negative); }
    .context { display: flex; flex-wrap: wrap; gap: 5px; width: 100%; max-width: 760px; margin: 0 auto; }
    .context:empty { display: none; }
    .context-chip { display: flex; align-items: center; gap: 5px; max-width: 100%; padding: 3px 7px; color: var(--muted); background: var(--raised); border: 1px solid var(--line); border-radius: 4px; font-size: 10px; }
    .context-chip button { padding: 0; color: var(--muted); background: transparent; border: 0; cursor: pointer; }
    .composer-wrap { position: relative; width: 100%; max-width: 760px; margin: 0 auto; padding-top: 8px; }
    .composer { padding: 9px 10px 7px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; transition: border-color 120ms ease, box-shadow 120ms ease; }
    .composer:focus-within { border-color: var(--accent); box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 26%, transparent); }
    .composer textarea { display: block; width: 100%; min-height: 38px; max-height: 160px; resize: none; padding: 2px 1px 8px; color: var(--text); background: transparent; border: 0; outline: 0; font: 13px/1.5 var(--vscode-font-family, "Segoe UI", system-ui, sans-serif); }
    .composer textarea:focus-visible { outline: 0; }
    .composer textarea::placeholder { color: var(--muted); opacity: .9; }
    .tools { display: flex; align-items: center; gap: 4px; min-height: 30px; border-top: 1px solid color-mix(in srgb, var(--line) 70%, transparent); padding-top: 6px; }
    .tool, .quiet-button { min-width: 28px; min-height: 28px; padding: 5px 7px; color: var(--muted); background: transparent; border: 0; border-radius: 4px; cursor: pointer; white-space: nowrap; font-size: 10px; }
    .tool-menu { position: relative; flex: 0 1 auto; min-width: 0; }
    .tool-menu-button { min-height: 28px; display: inline-flex; align-items: center; gap: 4px; max-width: 146px; padding: 4px 6px; color: var(--muted); background: transparent; border: 0; border-radius: 4px; cursor: pointer; white-space: nowrap; font-size: 11px; }
    .tool-menu-button:hover, .tool-menu-button[aria-expanded="true"] { color: var(--text); background: var(--raised); }
    .tool-menu-button:focus-visible { outline: 1px solid var(--accent); }
    .tool-menu-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .chevron { width: 10px; height: 10px; flex: 0 0 10px; color: var(--quiet); }
    .menu-popover { position: absolute; z-index: 8; left: 0; bottom: calc(100% + 8px); min-width: 170px; max-height: 260px; overflow: auto; padding: 4px; background: var(--vscode-quickInput-background, var(--raised)); border: 1px solid var(--line); border-radius: 7px; box-shadow: var(--shadow); }
    .menu-popover[hidden] { display: none; }
    .menu-option { width: 100%; display: flex; align-items: center; gap: 9px; padding: 7px 8px; text-align: left; color: var(--text); background: transparent; border: 0; border-radius: 4px; cursor: pointer; font-size: 11px; }
    .menu-option:hover, .menu-option[aria-checked="true"] { background: var(--vscode-list-hoverBackground, var(--surface)); }
    .menu-option[aria-checked="true"]::after { content: '✓'; margin-left: auto; color: var(--accent); }
    .menu-option-copy { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
    .model-search { width: 100%; min-height: 28px; margin: 3px 0 6px; padding: 5px 7px; color: var(--text); background: var(--raised); border: 1px solid var(--line); border-radius: 4px; outline: none; }
    .menu-option-copy small { color: var(--quiet); font-size: 10px; }
    .send { flex: 0 0 30px; width: 30px; height: 30px; display: grid; place-items: center; color: #1a120c; background: var(--accent); border: 0; border-radius: 6px; cursor: pointer; font-size: 16px; }
    .send:hover { background: var(--vscode-button-hoverBackground, var(--accent)); }
    .send.stop { background: var(--raised); color: var(--text); border: 1px solid var(--line); }
    .context-ring { width:30px;height:30px;position:relative;display:grid;place-items:center;color:var(--quiet);font-size:8px; }
    .context-ring svg { position:absolute;inset:5px;width:20px;height:20px;transform:rotate(-90deg); }
    .ring-track,.ring-value { fill:none;stroke:var(--line);stroke-width:2.4; }
    .ring-value { stroke:var(--accent);stroke-dasharray:59.7;stroke-dashoffset:59.7;transition:stroke-dashoffset 160ms ease; }
    .context-ring small { z-index:1;font-size:8px; }
    .queue-count { color:var(--muted);font-size:10px;white-space:nowrap; }
    .send:disabled { opacity: .45; cursor: default; }
    .suggestions { position: absolute; z-index: 5; left: 0; right: 0; bottom: calc(100% - 3px); max-height: 220px; overflow: auto; padding: 5px; background: var(--vscode-quickInput-background, var(--raised)); border: 1px solid var(--line); border-radius: 7px; box-shadow: var(--shadow); }
    .suggestion { width: 100%; display: flex; align-items: center; gap: 9px; padding: 8px; text-align: left; color: var(--text); background: transparent; border: 0; border-radius: 4px; cursor: pointer; font-size: 11px; }
    .suggestion:hover, .suggestion.active { background: var(--vscode-list-hoverBackground, var(--raised)); }
    .suggestion small { margin-left: auto; color: var(--quiet); font-size: 10px; }
    .suggestion mark { color:var(--text);background:color-mix(in srgb,var(--accent) 28%,transparent);border-radius:2px; }
    .notice { margin: 8px; color: var(--vscode-errorForeground, #dc7777); font-size: 11px; }
    button:focus-visible, textarea:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
    @keyframes appear { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes sheen { to { background-position: -220% 0; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
    @media (max-width: 470px) {
      .shell { padding: 0 10px; }.top { gap: 2px; }.thread { max-width: 34%; font-size: 11px; padding: 6px 3px; }
      .modes { margin: 0 2px; gap: 0; }.mode { padding: 5px 5px; font-size: 10px; }.project { display: none; }
      .icon { flex-basis: 26px; width: 26px; height: 26px; }
      .tools { gap: 2px; }.tool-menu-button { max-width: 112px; padding-inline: 4px; font-size: 10px; }.tool-menu { flex: 0 1 auto; }
      .empty { padding-left: 9px; padding-right: 9px; }.shortcuts { grid-template-columns: 1fr; }
    }
    @media (max-width: 360px) {
      .thread { max-width: 27%; }.mode { padding: 4px 3px; font-size: 9px; }.tools { gap: 1px; }.tool-menu-button { max-width: 94px; padding-inline: 3px; font-size: 9px; }
    }

  color-scheme:dark;
}
body.vscode-light, body.vscode-high-contrast-light {
  --cude-accent:#b8632f; --cude-on-accent:#090604; --cude-link:#91471f;
  --cude-bg:#fbfaf7; --cude-surface:#ffffff; --cude-raised:#efede7;
  --cude-text:#252720; --cude-muted:#55594f; --cude-border:#7b8073;
  --cude-positive:#286335; --cude-negative:#a32a28; --cude-warning:#715309;

}
body.vscode-high-contrast {
  --cude-bg:#000000; --cude-surface:#000000; --cude-raised:#171717;
