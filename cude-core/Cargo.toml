[package]
name = "cude-core"
version = "0.1.0"
edition = "2021"
description = "Cude IDE native core: indexing, search, AI context assembly over stdio JSON-RPC"
license = "MIT"

[dependencies]
ignore = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
